name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Build
        run: for p in src/*/*.csproj; do dotnet build "$p" -c Release || exit 1; done
      - name: Rodar exemplos
        run: for p in src/*/*.csproj; do echo "== $p"; dotnet run --project "$p" -c Release --no-build || exit 1; done
